[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelops"
version = "0.1.0"
description = "ALITA: Autonomous Listener, Investigator, Thinker, Aide. A research-companion agent named Pelops, inspired by Godzilla: Singular Point."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jay Steffens" }]
keywords = ["agent", "llm", "deepagents", "groq", "openrouter", "vstash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.1",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "groq>=0.20.0",
    "vstash-local",
    "apscheduler>=3.10.4",
    "chainlit>=2.0.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "pydantic>=2.0.0,<3",
    "aiogram>=3.13.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "langchain-openai>=1.0.0",
    "pydantic-settings>=2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "semble>=0.1.8",
]

[project.scripts]
pelops-doctor = "pelops.doctor:run"
pelops-bot = "pelops.telegram_bot:main"
pelops-scheduler = "pelops.scheduler:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=3.7.0",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pelops"]

[tool.uv.sources]
vstash-local = { path = "../vstash-local", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long -- handled by formatter
    "B008",   # function call in default arg (FastAPI/aiogram idiom)
    "RUF012", # mutable class attributes -- pydantic / langchain need them
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["pelops", "tests"]
exclude = [".venv", "scripts/smoke", "data", "docs"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportPrivateImportUsage = "none"

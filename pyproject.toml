[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pelops"
version = "0.1.0"
description = "ALITA: Autonomous Listener, Investigator, Thinker, Aide. A research-companion agent named Pelops, inspired by Godzilla: Singular Point."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jay Steffens" }]
keywords = ["agent", "llm", "deepagents", "groq", "openrouter", "vstash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "deepagents>=0.6.1",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "groq>=0.20.0",
    "vstash-local",
    "apscheduler>=3.10.4",
    "chainlit>=2.0.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "pydantic>=2.0.0,<3",
    "aiogram>=3.13.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "langchain-openai>=1.0.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=3.7.0",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pelops"]

[tool.uv.sources]
vstash-local = { path = "../vstash-local", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
